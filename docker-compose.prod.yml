# 生产环境覆盖层：
# - 与 docker-compose.yml 叠加使用
# - 通过 *_PROD 环境变量注入生产凭据，避免与本地/开发凭据混用

services:
  server:
    environment:
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID_PROD:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET_PROD:-}
      ADMIN_GITHUB_LOGIN_NAME: ${ADMIN_GITHUB_LOGIN_NAME_PROD:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI_PROD:-}

  web:
    build:
      args:
        NEXT_PUBLIC_GITHUB_CLIENT_ID: ${NEXT_PUBLIC_GITHUB_CLIENT_ID_PROD:-}
        NEXT_PUBLIC_GITHUB_REDIRECT_URI: ${NEXT_PUBLIC_GITHUB_REDIRECT_URI_PROD:-}
    environment:
      NEXT_PUBLIC_GITHUB_CLIENT_ID: ${NEXT_PUBLIC_GITHUB_CLIENT_ID_PROD:-}
      NEXT_PUBLIC_GITHUB_REDIRECT_URI: ${NEXT_PUBLIC_GITHUB_REDIRECT_URI_PROD:-}

  remark42:
    environment:
      - AUTH_GITHUB_CID=${REMARK42_GITHUB_CLIENT_ID_PROD:-}
      - AUTH_GITHUB_CSEC=${REMARK42_GITHUB_CLIENT_SECRET_PROD:-}
      - ORIGIN=${REMARK42_ORIGIN_PROD:-}
      - REMARK_URL=${REMARK42_URL_PROD:-}
