# 生产环境覆盖层：
# - 与 docker-compose.yml 叠加使用
# - 通过 *_PROD 环境变量注入生产凭据，避免与本地/开发凭据混用

services:
  server:
    environment:
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID_PROD:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET_PROD:-}
      ADMIN_GITHUB_LOGIN_NAME: ${ADMIN_GITHUB_LOGIN_NAME_PROD:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI_PROD:-}
      IMAGE_BED_TYPE: ${IMAGE_BED_TYPE_PROD:-picui}
      IMAGE_BED_PUBLIC_URL: ${IMAGE_BED_PUBLIC_URL_PROD:-https://free.picui.cn}
      PICUI_API_URL: ${PICUI_API_URL_PROD:-https://picui.cn/api/v1}
      PICUI_TOKEN: ${PICUI_TOKEN_PROD:-}
      PICUI_STRATEGY_ID: ${PICUI_STRATEGY_ID_PROD:-9}
      PICUI_PERMISSION: ${PICUI_PERMISSION_PROD:-}
      PICUI_ALBUM_ID: ${PICUI_ALBUM_ID_PROD:-}
      PICUI_EXPIRED_AT: ${PICUI_EXPIRED_AT_PROD:-}
      CHEVERETO_URL: ${CHEVERETO_URL_PROD:-}
      CHEVERETO_API_KEY: ${CHEVERETO_API_KEY_PROD:-}

  web:
    build:
      args:
        NEXT_PUBLIC_GITHUB_CLIENT_ID: ${NEXT_PUBLIC_GITHUB_CLIENT_ID_PROD:-}
        NEXT_PUBLIC_GITHUB_REDIRECT_URI: ${NEXT_PUBLIC_GITHUB_REDIRECT_URI_PROD:-}
        IMAGE_BED_PUBLIC_URL: ${IMAGE_BED_PUBLIC_URL_PROD:-https://free.picui.cn}
        CHEVERETO_URL: ${CHEVERETO_URL_PROD:-}
    environment:
      NEXT_PUBLIC_GITHUB_CLIENT_ID: ${NEXT_PUBLIC_GITHUB_CLIENT_ID_PROD:-}
      NEXT_PUBLIC_GITHUB_REDIRECT_URI: ${NEXT_PUBLIC_GITHUB_REDIRECT_URI_PROD:-}
      IMAGE_BED_PUBLIC_URL: ${IMAGE_BED_PUBLIC_URL_PROD:-https://free.picui.cn}
      NEXT_PUBLIC_IMAGE_BED_URL: ${IMAGE_BED_PUBLIC_URL_PROD:-https://free.picui.cn}
      CHEVERETO_URL: ${CHEVERETO_URL_PROD:-}

  remark42:
    environment:
      - AUTH_GITHUB_CID=${REMARK42_GITHUB_CLIENT_ID_PROD:-}
      - AUTH_GITHUB_CSEC=${REMARK42_GITHUB_CLIENT_SECRET_PROD:-}
      - ORIGIN=${REMARK42_ORIGIN_PROD:-}
      - REMARK_URL=${REMARK42_URL_PROD:-}
