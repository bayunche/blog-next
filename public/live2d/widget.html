<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Live2D Widget Frame</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }
    #root {
      position: relative;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    (function () {
      var FRAME_SOURCE = 'sakurairo-live2d';
      var HOST_SOURCE = 'sakurairo-live2d-host';
      var models = [
        '/live2d/Terisa/model.json',
        '/live2d/miku/miku.model.json',
        '/live2d/kobayaxi/model.json'
      ];
      var messages = [
        '欢迎来到我的博客！(｡･ω･｡)ﾉ♡',
        '今天也要开心哦！٩(◕‿◕｡)۶',
        '有什么我可以帮你的吗？',
        '点击我可以切换模型哦~',
        '这里是一个有趣的地方！',
        '记得常来玩呀！',
        '希望你喜欢这个网站~'
      ];

      var currentModel = 0;
      var initialModel = 0;

      function parseModelIndex(input) {
        var parsed = Number(input);
        if (!Number.isFinite(parsed)) return 0;
        return parsed;
      }

      try {
        var initialSearch = new URLSearchParams(window.location.search);
        initialModel = parseModelIndex(initialSearch.get('model'));
      } catch (error) {
        initialModel = 0;
      }

      function postToHost(type, payload) {
        window.parent.postMessage({
          source: FRAME_SOURCE,
          type: type,
          payload: payload || {}
        }, window.location.origin);
      }

      function randomMessage() {
        return messages[Math.floor(Math.random() * messages.length)];
      }

      function hasWebGL() {
        try {
          var canvas = document.createElement('canvas');
          return !!(canvas.getContext('webgl') || canvas.getContext('experimental-webgl'));
        } catch (error) {
          return false;
        }
      }

      function removeWidget() {
        var widget = document.getElementById('live2d-widget');
        if (widget && widget.parentNode) {
          widget.parentNode.removeChild(widget);
        }
        var canvas = document.getElementById('live2dcanvas');
        if (canvas && canvas.parentNode) {
          canvas.parentNode.removeChild(canvas);
        }
      }

      function initWidget(index) {
        if (!hasWebGL()) {
          postToHost('error', { error: '看板娘加载失败：浏览器 WebGL 不可用' });
          return;
        }

        if (!window.L2Dwidget) {
          postToHost('error', { error: 'L2Dwidget 未就绪' });
          return;
        }

        currentModel = ((index % models.length) + models.length) % models.length;
        window.__sakurairoLive2dModelIndex = currentModel;
        removeWidget();

        try {
          window.L2Dwidget.init({
            pluginRootPath: 'https://cdn.jsdelivr.net/npm/live2d-widget@3.1.4/',
            pluginJsPath: 'lib/',
            pluginModelPath: 'assets/',
            tagMode: false,
            debug: false,
            model: {
              jsonPath: models[currentModel],
              scale: 1
            },
            display: {
              superSample: 2,
              width: 150,
              height: 300,
              position: 'left',
              hOffset: 0,
              vOffset: -20
            },
            mobile: {
              show: false,
              scale: 0.5
            },
            name: {
              canvas: 'live2dcanvas',
              div: 'live2d-widget'
            },
            react: {
              opacity: 1
            }
          });
        } catch (error) {
          postToHost('error', { error: '看板娘模型初始化失败' });
          return;
        }

        postToHost('model-changed', { index: currentModel });
        postToHost('message', { text: randomMessage() });
      }

      function switchModel(index) {
        var target = typeof index === 'number' ? index : currentModel + 1;
        initWidget(target);
      }

      function capture() {
        var canvas = document.getElementById('live2dcanvas');
        if (!canvas) {
          postToHost('message', { text: '截图失败：画布未就绪' });
          return;
        }
        try {
          var link = document.createElement('a');
          link.download = 'live2d-screenshot.png';
          link.href = canvas.toDataURL();
          link.click();
          postToHost('message', { text: '截图已保存！' });
        } catch (error) {
          postToHost('error', { error: '截图失败' });
        }
      }

      window.addEventListener('message', function (event) {
        if (event.origin !== window.location.origin) return;
        var data = event.data || {};
        if (data.source !== HOST_SOURCE) return;

        if (data.type === 'switch-model') {
          switchModel(data.payload && data.payload.index);
          return;
        }
        if (data.type === 'speak') {
          postToHost('message', { text: randomMessage() });
          return;
        }
        if (data.type === 'capture') {
          capture();
        }
      });

      function loadScript() {
        if (window.L2Dwidget) {
          initWidget(initialModel);
          postToHost('ready');
          return;
        }

        var sources = [
          '/live2d/lib/L2Dwidget.min.js',
          'https://cdn.jsdelivr.net/npm/live2d-widget@3.1.4/lib/L2Dwidget.min.js',
          'https://unpkg.com/live2d-widget@3.1.4/lib/L2Dwidget.min.js'
        ];
        var idx = 0;

        function tryNextSource() {
          if (window.L2Dwidget) {
            initWidget(initialModel);
            postToHost('ready');
            return;
          }
          if (idx >= sources.length) {
            postToHost('error', { error: '看板娘脚本加载失败（本地与 CDN 均不可用）' });
            return;
          }

          var src = sources[idx++];
          var script = document.createElement('script');
          script.src = src;
          script.async = true;
          script.onload = function () {
            if (!window.L2Dwidget) {
              tryNextSource();
              return;
            }
            initWidget(initialModel);
            postToHost('ready');
          };
          script.onerror = function () {
            tryNextSource();
          };
          document.head.appendChild(script);
        }

        tryNextSource();
      }

      loadScript();
    })();
  </script>
</body>
</html>
