version: '3.8'

# 开发/测试环境简化版 Docker Compose
# 不包含 Nginx，直接暴露前后端端口

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: sakurairo-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sakurairo_blog}
      MYSQL_USER: ${MYSQL_USER:-sakurairo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sakurairo123}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data_dev:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sakurairo-dev

  # 后端服务
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: sakurairo-server-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      SERVER_PORT: 6060
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sakurairo_blog}
      MYSQL_USER: ${MYSQL_USER:-sakurairo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sakurairo123}
      TOKEN_SECRET: ${TOKEN_SECRET:-dev_jwt_secret}
      TOKEN_EXPIRES_IN: 720h
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      ADMIN_GITHUB_LOGIN_NAME: ${ADMIN_GITHUB_LOGIN_NAME:-}
      GITHUB_REDIRECT_URI: ${NEXT_PUBLIC_GITHUB_REDIRECT_URI:-}
      IMAGE_BED_TYPE: ${IMAGE_BED_TYPE:-chevereto}
      CHEVERETO_URL: ${CHEVERETO_URL:-}
      CHEVERETO_API_KEY: ${CHEVERETO_API_KEY:-}
    ports:
      - "6060:6060"
    volumes:
      - ./server/data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sakurairo-dev

  # 前端服务
  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        API_URL: http://server:6060
        INTERNAL_API_URL: http://server:6060
        INTERNAL_REMARK42_URL: http://remark42:8080
        NEXT_PUBLIC_REMARK42_URL: ${NEXT_PUBLIC_REMARK42_URL:-http://localhost:8080}
        NEXT_PUBLIC_REMARK42_USE_PROXY: ${NEXT_PUBLIC_REMARK42_USE_PROXY:-true}
        NEXT_PUBLIC_REMARK42_SITE_ID: ${NEXT_PUBLIC_REMARK42_SITE_ID:-sakurairo}
        NEXT_PUBLIC_GITHUB_CLIENT_ID: ${NEXT_PUBLIC_GITHUB_CLIENT_ID:-}
        NEXT_PUBLIC_GITHUB_REDIRECT_URI: ${NEXT_PUBLIC_GITHUB_REDIRECT_URI:-}
        CHEVERETO_URL: ${CHEVERETO_URL:-}
    container_name: sakurairo-web-dev
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      API_URL: http://server:6060
      INTERNAL_API_URL: http://server:6060
      INTERNAL_REMARK42_URL: http://remark42:8080
      NEXT_PUBLIC_REMARK42_URL: ${NEXT_PUBLIC_REMARK42_URL:-http://localhost:8080}
      NEXT_PUBLIC_REMARK42_USE_PROXY: ${NEXT_PUBLIC_REMARK42_USE_PROXY:-true}
      NEXT_PUBLIC_REMARK42_SITE_ID: ${NEXT_PUBLIC_REMARK42_SITE_ID:-sakurairo}
      NEXT_PUBLIC_GITHUB_CLIENT_ID: ${NEXT_PUBLIC_GITHUB_CLIENT_ID:-}
      NEXT_PUBLIC_GITHUB_REDIRECT_URI: ${NEXT_PUBLIC_GITHUB_REDIRECT_URI:-}
      CHEVERETO_URL: ${CHEVERETO_URL:-}
    ports:
      - "3000:3000"
    depends_on:
      - server
    networks:
      - sakurairo-dev

  # Remark42 评论系统
  remark42:
    image: umputun/remark42:latest
    container_name: sakurairo-remark42-dev
    restart: unless-stopped
    environment:
      - REMARK_URL=${REMARK42_URL:-http://localhost:8080}
      - SECRET=${REMARK42_SECRET:-secret}
      - SITE=${REMARK42_SITE_ID:-sakurairo}
      - AUTH_GITHUB_CID=${REMARK42_GITHUB_CLIENT_ID:-}
      - AUTH_GITHUB_CSEC=${REMARK42_GITHUB_CLIENT_SECRET:-}
      - ORIGIN=${REMARK42_ORIGIN:-http://localhost:3000}
    ports:
      - "8080:8080"
    volumes:
      - ./docker/remark42:/srv/var
    networks:
      - sakurairo-dev

volumes:
  mysql_data_dev:


networks:
  sakurairo-dev:
    driver: bridge
