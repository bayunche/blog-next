version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: sakurairo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sakurairo_blog}
      MYSQL_USER: ${MYSQL_USER:-sakurairo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sakurairo123}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sakurairo-network

  # 后端服务
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: sakurairo-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SERVER_PORT: 6060
      MUSIC_API_URL: http://music-api:3000
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sakurairo_blog}
      MYSQL_USER: ${MYSQL_USER:-sakurairo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sakurairo123}
      TOKEN_SECRET: ${TOKEN_SECRET:-your_jwt_secret_key_change_this}
      TOKEN_EXPIRES_IN: 720h
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      ADMIN_GITHUB_LOGIN_NAME: ${ADMIN_GITHUB_LOGIN_NAME:-}
    ports:
      - "6062:6060"
    volumes:
      - ./server/data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      music-api:
        condition: service_started
    networks:
      - sakurairo-network

  # 前端服务（Next.js）
  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        API_URL: http://server:6060
        INTERNAL_API_URL: http://server:6060
        NEXT_PUBLIC_REMARK42_URL: ${NEXT_PUBLIC_REMARK42_URL:-http://localhost:8080}
        NEXT_PUBLIC_REMARK42_SITE_ID: ${NEXT_PUBLIC_REMARK42_SITE_ID:-sakurairo}
        NEXT_PUBLIC_GITHUB_CLIENT_ID: ${NEXT_PUBLIC_GITHUB_CLIENT_ID:-}
    container_name: sakurairo-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      API_URL: http://server:6060
      INTERNAL_API_URL: http://server:6060
      NEXT_PUBLIC_REMARK42_URL: ${NEXT_PUBLIC_REMARK42_URL:-http://localhost:8080}
      NEXT_PUBLIC_REMARK42_SITE_ID: ${NEXT_PUBLIC_REMARK42_SITE_ID:-sakurairo}
      NEXT_PUBLIC_GITHUB_CLIENT_ID: ${NEXT_PUBLIC_GITHUB_CLIENT_ID:-}
    ports:
      - "3002:3000"
    depends_on:
      - server
    networks:
      - sakurairo-network

  # 网易云音乐 API 服务
  music-api:
    build: ./server/netease_api
    container_name: sakurairo-music-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - "3003:3000"
    networks:
      - sakurairo-network

  # Nginx 反向代理（可选，生产环境推荐）
  nginx:
    image: nginx:alpine
    container_name: sakurairo-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
      - server
    networks:
      - sakurairo-network

  # Remark42 评论系统
  remark42:
    image: umputun/remark42:latest
    container_name: sakurairo-remark42
    restart: unless-stopped
    environment:
      - REMARK_URL=${REMARK42_URL:-http://localhost:8080}
      - SECRET=${REMARK42_SECRET:-secret}
      - SITE=${REMARK42_SITE_ID:-sakurairo}
      - AUTH_GITHUB_CID=${REMARK42_GITHUB_CLIENT_ID}
      - AUTH_GITHUB_CSEC=${REMARK42_GITHUB_CLIENT_SECRET}
      - ORIGIN=${REMARK42_ORIGIN_PROD:-http://localhost:3002}
    ports:
      - "8080:8080"
    volumes:
      - ./docker/remark42:/srv/var
    networks:
      - sakurairo-network

  # 数据库维护服务（备份/恢复）
  db-backup:
    build:
      context: ./docker/db-maintain
    container_name: sakurairo-db-backup
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sakurairo_blog}
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
    volumes:
      - ./docker/mysql/backup:/backup
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sakurairo-network

volumes:
  mysql_data:


networks:
  sakurairo-network:
    driver: bridge
